[Service]
Environment=FP_DRIVERS_ALLOWLIST=goodix53x5
Environment=GOODIX550C_ALLOW_VOLATILE_INIT=1
Environment=GOODIX550C_ALLOW_MANUAL_FDT_POLL=1
Environment=GOODIX550C_PSK_FILE=/etc/goodix550c/goodix550c.psk
Environment=GOODIX550C_LOG_SUMMARY=1
# Tuning campaign r1/r4 (docs/EXPERIMENTS.md): result 411 -> 258 ms after touch.
# Ignored by libfprint builds before +goodix550c6. Local overrides: a 60-*.conf drop-in.
Environment=GOODIX550C_TUNE_SETTLE_MS=150 GOODIX550C_TUNE_POLL_DELAY_MS=60
UMask=0077
