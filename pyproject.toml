[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "goodix-550c-lab"
version = "0.1.0"
description = "Safety-gated reverse-engineering tools for the Goodix 27c6:550c fingerprint reader"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["pyusb>=1.3,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.12,<1"]
tui = ["textual>=2.1,<3", "rich>=13.9"]
reverse = ["pefile>=2024.8.26", "capstone>=5,<6"]
dpapi = ["impacket>=0.13.1,<0.14"]

[project.scripts]
goodix550c = "goodix550c.cli:main"
finger = "goodix550c_tui.app:main"
goodix550c-tui = "goodix550c_tui.app:main"

[tool.setuptools.packages.find]
where = ["src", "tui"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
