name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # secret scan walks the full history
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install
        run: |
          sudo apt-get update -q && sudo apt-get install -yq dpkg-dev
          python -m pip install -q -e '.[dev,tui]' 'textual==2.1.2' 'rich==13.9.4'
      - name: Policy, packaging, ctl, report and TUI tests
        run: python -m pytest -q -o addopts="" --ignore=tests/test_dpapi_recovery.py
      - name: Secret scan (heuristics; the real-key scan runs locally before each push)
        run: python3 scripts/check_no_secrets.py
